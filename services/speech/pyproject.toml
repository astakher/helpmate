[project]
name = "helpmate-speech"
version = "0.1.0"
description = "HelpMate speech service (inference plane): faster-whisper STT + Kokoro TTS on CPU"
authors = [
    { name = "Aman Takher", email = "130939238+astakher@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Real models (Phase 5): uv sync --extra real
real = []

[project.scripts]
helpmate-speech = "helpmate_speech.app:run"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
