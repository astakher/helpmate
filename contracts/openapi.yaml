openapi: 3.1.0
info:
  title: HelpMate API
  version: 0.1.0
paths:
  /api/health:
    get:
      tags:
      - health
      summary: Health
      description: 'Which adapter is plugged into each seam: the System status page reads this.'
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/chat/sessions:
    get:
      tags:
      - chat
      summary: List Sessions
      description: 'The chat list, most recent activity first. A session with no messages yet isn''t listed.

        Untitled sessions (from before titles existed) get their first message as the title.'
      operationId: list_sessions_api_chat_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChatSession'
                type: array
                title: Response List Sessions Api Chat Sessions Get
    post:
      tags:
      - chat
      summary: Create Session
      operationId: create_session_api_chat_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}:
    delete:
      tags:
      - chat
      summary: Delete Session
      description: 'Deletes the chat and its messages for good. Approval cards it produced stay on the

        Approvals page and in the audit log.'
      operationId: delete_session_api_chat_sessions__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat/sessions/{session_id}/messages:
    get:
      tags:
      - chat
      summary: List Messages
      operationId: list_messages_api_chat_sessions__session_id__messages_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
                title: Response List Messages Api Chat Sessions  Session Id  Messages Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - chat
      summary: Post Message
      operationId: post_message_api_chat_sessions__session_id__messages_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageIn'
      responses:
        '200':
          description: 'Server-sent events. Each frame is `event: <type>` + `data: <ChatEvent JSON>`;
            `: ping` comments are heartbeats.'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatEvent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/proposals:
    get:
      tags:
      - proposals
      summary: List Proposals
      operationId: list_proposals_api_proposals_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ProposalStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
                title: Response List Proposals Api Proposals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/proposals/{proposal_id}:
    get:
      tags:
      - proposals
      summary: Get Proposal
      operationId: get_proposal_api_proposals__proposal_id__get
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/proposals/{proposal_id}/decision:
    post:
      tags:
      - proposals
      summary: Decide
      description: Approve, edit-then-approve, or reject. The only way an agent write ever executes.
      operationId: decide_api_proposals__proposal_id__decision_post
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          title: Proposal Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tools:
    get:
      tags:
      - tools
      summary: List Tools
      description: The agent's tools and their argument schemas (the approval card's Edit form uses these).
      operationId: list_tools_api_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ToolInfo'
                type: array
                title: Response List Tools Api Tools Get
  /api/folders:
    get:
      tags:
      - organize
      summary: List Folders
      operationId: list_folders_api_folders_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Folder'
                type: array
                title: Response List Folders Api Folders Get
    post:
      tags:
      - organize
      summary: Create Folder
      operationId: create_folder_api_folders_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/folders/{folder_id}/items:
    get:
      tags:
      - organize
      summary: List Items
      operationId: list_items_api_folders__folder_id__items_get
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          title: Folder Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
                title: Response List Items Api Folders  Folder Id  Items Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - organize
      summary: Create Item
      operationId: create_item_api_folders__folder_id__items_post
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          title: Folder Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks:
    get:
      tags:
      - organize
      summary: List Tasks
      operationId: list_tasks_api_tasks_get
      parameters:
      - name: horizon
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Horizon'
          - type: 'null'
          title: Horizon
      - name: done
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Done
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
                title: Response List Tasks Api Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - organize
      summary: Create Task
      operationId: create_task_api_tasks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}:
    patch:
      tags:
      - organize
      summary: Update Task
      operationId: update_task_api_tasks__task_id__patch
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTaskIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/reminders:
    get:
      tags:
      - organize
      summary: List Reminders
      operationId: list_reminders_api_reminders_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ReminderStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
                title: Response List Reminders Api Reminders Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/reminders/{reminder_id}/cancel:
    post:
      tags:
      - organize
      summary: Cancel Reminder
      operationId: cancel_reminder_api_reminders__reminder_id__cancel_post
      parameters:
      - name: reminder_id
        in: path
        required: true
        schema:
          type: string
          title: Reminder Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/today:
    get:
      tags:
      - organize
      summary: Today
      description: 'The Today board and daily brief: today''s reminders and events, free time left, newest

        unread mail, this week''s tasks and what''s waiting for approval.'
      operationId: today_api_today_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayOut'
  /api/week:
    get:
      tags:
      - plan
      summary: Week
      operationId: week_api_week_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekOut'
  /api/week/schedule-task:
    post:
      tags:
      - plan
      summary: Schedule Task
      description: Propose a calendar event for the task in the first free slot that fits (approval card).
      operationId: schedule_task_api_week_schedule_task_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleTaskIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memory/suggestions:
    get:
      tags:
      - memory
      summary: List Suggestions
      operationId: list_suggestions_api_memory_suggestions_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SuggestionStatus'
          - type: 'null'
          default: pending
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemorySuggestion'
                title: Response List Suggestions Api Memory Suggestions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memory/suggestions/{suggestion_id}/decision:
    post:
      tags:
      - memory
      summary: Decide Suggestion
      operationId: decide_suggestion_api_memory_suggestions__suggestion_id__decision_post
      parameters:
      - name: suggestion_id
        in: path
        required: true
        schema:
          type: string
          title: Suggestion Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySuggestion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/memory/facts:
    get:
      tags:
      - memory
      summary: List Facts
      operationId: list_facts_api_memory_facts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemoryFact'
                type: array
                title: Response List Facts Api Memory Facts Get
  /api/memory/facts/{fact_id}:
    patch:
      tags:
      - memory
      summary: Edit Fact
      description: The owner corrects a remembered fact. A direct edit by the owner, so no approval card.
      operationId: edit_fact_api_memory_facts__fact_id__patch
      parameters:
      - name: fact_id
        in: path
        required: true
        schema:
          type: string
          title: Fact Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactUpdateIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryFact'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - memory
      summary: Delete Fact
      operationId: delete_fact_api_memory_facts__fact_id__delete
      parameters:
      - name: fact_id
        in: path
        required: true
        schema:
          type: string
          title: Fact Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/export:
    get:
      tags:
      - memory
      summary: Export Everything
      operationId: export_everything_api_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportOut'
  /api/voice/transcribe:
    post:
      tags:
      - voice
      summary: Transcribe
      operationId: transcribe_api_voice_transcribe_post
      parameters:
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mpeg:
            schema:
              type: string
              format: binary
  /api/voice/speak:
    post:
      tags:
      - voice
      summary: Speak
      operationId: speak_api_voice_speak_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/push/vapid-public-key:
    get:
      tags:
      - push
      summary: Vapid Public Key
      operationId: vapid_public_key_api_push_vapid_public_key_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidKeyOut'
  /api/push/subscriptions:
    post:
      tags:
      - push
      summary: Subscribe
      operationId: subscribe_api_push_subscriptions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - push
      summary: Unsubscribe
      operationId: unsubscribe_api_push_subscriptions_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/push/test:
    post:
      tags:
      - push
      summary: Send Test
      operationId: send_test_api_push_test_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResult'
  /api/push/ack:
    post:
      tags:
      - push
      summary: Ack
      description: 'Called by the service worker when a push arrives: this is how latency gets measured.'
      operationId: ack_api_push_ack_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/push/deliveries:
    get:
      tags:
      - push
      summary: Deliveries
      operationId: deliveries_api_push_deliveries_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Delivery'
                type: array
                title: Response Deliveries Api Push Deliveries Get
  /api/settings/notifications:
    get:
      tags:
      - settings
      summary: Get Notification Settings
      operationId: get_notification_settings_api_settings_notifications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
    put:
      tags:
      - settings
      summary: Put Notification Settings
      operationId: put_notification_settings_api_settings_notifications_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/audit:
    get:
      tags:
      - audit
      summary: List Audit
      operationId: list_audit_api_audit_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
                title: Response List Audit Api Audit Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '401':
          description: wrong username or password
        '429':
          description: locked
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/mfa:
    post:
      tags:
      - auth
      summary: Verify Mfa
      operationId: verify_mfa_api_auth_mfa_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/mfa/enroll:
    post:
      tags:
      - auth
      summary: Enroll Mfa
      operationId: enroll_mfa_api_auth_mfa_enroll_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollOut'
        '409':
          description: the dev login can't enable two-step verification
  /api/auth/mfa/enroll/confirm:
    post:
      tags:
      - auth
      summary: Confirm Mfa
      description: 'Finish enrolment with the first code from the authenticator app. Until this succeeds,

        two-step verification is NOT on (a scanned QR code alone changes nothing).'
      operationId: confirm_mfa_api_auth_mfa_enroll_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaConfirmIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '400':
          description: the code doesn't match
        '409':
          description: the dev login can't enable two-step verification
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
