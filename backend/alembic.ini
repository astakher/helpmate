# Stand-in for Workstream B - not part of the Part C deliverable
# Schema migrations for HELPMATE_REPO=postgres. The database URL comes from HELPMATE_DATABASE_URL
# (.env), never from this file. From backend/:
#   uv run alembic upgrade head        (the API also runs this at start-up)
#   uv run alembic revision -m "..."   (new migration in migrations/versions/)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
